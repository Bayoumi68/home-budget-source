publish_to: 'none'
version: 1.0.81+2081

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  speech_to_text: 7.4.0
  permission_handler: ^11.3.0
  intl: ^0.19.0
  fl_chart: ^0.66.0
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  cloud_firestore: ^5.6.0
  firebase_core: ^3.10.0
  firebase_auth: ^5.5.0
  app_links: ^6.3.2
  google_sign_in: ^6.2.1
  http: ^1.2.2
  flutter_local_notifications: ^17.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
