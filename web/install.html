<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>فتح Home Budget</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="افتح Home Budget على الويب فورًا، أو حمّل APK اختياريًا على أندرويد.">
  <meta property="og:title" content="فتح Home Budget">
  <meta property="og:description" content="الويب يعمل على أندرويد وآيفون بدون تثبيت، وAPK اختياري لأندرويد.">
  <meta property="og:type" content="website">
  <style>
    body{font-family:Arial,Tahoma,sans-serif;background:#f6f2ea;color:#053f38;margin:0;padding:22px}
    .card{max-width:520px;margin:auto;background:white;border-radius:18px;padding:22px;box-shadow:0 4px 18px #0002}
    h1{font-size:24px;margin-top:0}.btn{display:block;width:100%;box-sizing:border-box;text-align:center;margin:12px 0;padding:14px 16px;border-radius:14px;text-decoration:none;border:0;font-size:18px;font-weight:bold}
    .download{background:#087464;color:white}.open{background:#d9b45b;color:#173c35}.web{background:#173c35;color:white}.copy{background:#eee;color:#173c35}.note{font-size:14px;color:#555;line-height:1.7}.warn{background:#fff5d8;border-radius:12px;padding:10px;color:#5b4100} code{direction:ltr;display:block;background:#eee;padding:10px;border-radius:10px;overflow-wrap:anywhere;text-align:center;font-size:20px;font-weight:bold;letter-spacing:2px}
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Home Budget — فتح التطبيق</h1>
    <p class="note" id="desc">افتح نسخة الويب فورًا على أي موبايل. تحميل APK على أندرويد اختياري.</p>
    <a id="webBtn" class="btn web" href="/">فتح نسخة الويب الآن</a>
    <a id="androidBtn" class="btn download" href="/download.html" target="_blank" rel="noopener">اختياري: تحميل Android APK</a>
    <button id="openBtn" class="btn open" onclick="openInvite()">اختياري: فتح الدعوة في تطبيق أندرويد المثبت</button>
    <p id="platformNote" class="note warn"></p>
    <p class="note">لو زر الفتح لم يعمل، افتح التطبيق يدويًا واكتب رقم تليفونك المسجل عند قائد العائلة وكود الدعوة التالي:</p>
    <code id="codeBox"></code>
    <button id="copyCodeBtn" class="btn copy" onclick="copyInviteCode()">نسخ كود الدعوة فقط</button>
    <p id="copyNote" class="note"></p>
  </div>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('invite') || params.get('code') || '';
  const teamId = params.get('teamId') || '';
  const hasInvite = code || params.get('groupId') || params.get('familyId');
  const isTeamInvite = hasInvite && teamId;
  const newFamilyMode = !hasInvite && (params.get('mode') === 'newFamily' || params.get('reset') === '1');
  const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isAndroid = /android/i.test(navigator.userAgent);
  const webParams = new URLSearchParams(params);
  webParams.set('web', '1');
  document.getElementById('webBtn').href = '/?' + webParams.toString();
  document.getElementById('title').textContent = hasInvite
    ? (isTeamInvite ? 'Home Budget — دعوة فريق' : 'Home Budget — دعوة عائلية')
    : newFamilyMode
      ? 'Home Budget — تجربة وإنشاء عائلة جديدة'
      : 'Home Budget — فتح التطبيق';
  document.getElementById('desc').textContent = hasInvite
    ? (isTeamInvite
      ? 'هذه دعوة فريق داخل عائلة. افتح الويب واكتب رقم تليفونك وكود الدعوة. لو أول مرة اكتب اسمك أيضًا، وبعد الدخول ستجد الفريق في زر الفرق.'
      : 'افتح نسخة الويب فورًا للانضمام. اكتب رقم تليفونك وكود الدعوة. لو أول مرة اكتب اسمك أيضًا.')
    : newFamilyMode
      ? 'هذا الرابط للتجربة فقط. افتح الويب واكتب اسمك ورقمك واختر إنشاء عائلة جديدة.'
    : 'نسخة الويب تعمل على أندرويد وآيفون بدون تثبيت. APK اختياري لأندرويد فقط.';
  document.getElementById('platformNote').textContent = isiOS
    ? 'تم اكتشاف iPhone: استخدم نسخة الويب. ملاحظة: التسجيل الصوتي على iPhone Web قد لا يعمل بسبب قيود Safari؛ استخدم الكتابة أو ميكروفون الكيبورد.'
    : isAndroid
      ? 'تم اكتشاف Android: يمكنك استخدام الويب الآن بدون تحميل. لو الصوت من المتصفح لم يعمل، استخدم ميكروفون الكيبورد أو حمّل APK الاختياري.'
      : 'استخدم نسخة الويب بدون تثبيت. APK متاح فقط لأندرويد كاختيار إضافي.';
  if (isiOS) {
    document.getElementById('androidBtn').style.display = 'none';
    document.getElementById('openBtn').style.display = 'none';
  }
  if (!hasInvite) {
    document.getElementById('openBtn').style.display = 'none';
    document.getElementById('codeBox').previousElementSibling.style.display = 'none';
    document.getElementById('codeBox').style.display = 'none';
    document.getElementById('copyCodeBtn').style.display = 'none';
  }
  document.getElementById('codeBox').textContent = code || 'لا يوجد كود في الرابط';
  async function copyInviteCode(){
    if (!code) return;
    try {
      await navigator.clipboard.writeText(code);
      document.getElementById('copyNote').textContent = 'تم نسخ كود الدعوة فقط.';
    } catch (e) {
      document.getElementById('copyNote').textContent = 'لو النسخ لم يعمل، اضغط مطولًا على الكود وانسخه.';
    }
  }
  function openInvite(){
    const groupId = encodeURIComponent(params.get('groupId') || params.get('familyId') || '');
    const team = encodeURIComponent(teamId);
    const teamParam = team ? `&teamId=${team}` : '';
    location.href = `budgethome://join?invite=${encodeURIComponent(code)}&groupId=${groupId}${teamParam}&auto=1`;
  }
</script>
</body>
</html>
